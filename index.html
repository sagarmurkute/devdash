<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevDash | Modern Developer Dashboard</title>
  <meta name="description" content="A feature-rich, high-performance vanilla developer dashboard with GitHub streak heatmap, sprint kanban, pomodoro timer, and developer utilities.">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Phosphor Icons for crisp developer symbols -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Core CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/command-palette.css">
  <link rel="stylesheet" href="css/github-widget.css">
  <link rel="stylesheet" href="css/kanban.css">
  <link rel="stylesheet" href="css/pomodoro.css">
  <link rel="stylesheet" href="css/toolbox.css">
  <link rel="stylesheet" href="css/widgets.css">
</head>
<body>
  <div class="app-container">
    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Dynamic Header / Timezone Bar (Commit 2) -->
      <header id="main-header" class="header-container"></header>

      <!-- Dashboard Grid of Interactive Widgets -->
      <section class="dashboard-grid">
        <!-- GitHub Matrix & Stats (Commit 4) -->
        <div id="github-widget-container" class="col-span-12"></div>

        <!-- Kanban Sprint Planner (Commit 5) -->
        <div id="kanban-widget-container" class="col-span-7"></div>

        <!-- Pomodoro Focus Station (Commit 6) -->
        <div id="pomodoro-widget-container" class="col-span-5"></div>

        <!-- Dev Utilities & Code Vault (Commit 7) -->
        <div id="toolbox-widget-container" class="col-span-7"></div>

        <!-- System Port Monitor & Tech News (Commit 8) -->
        <div id="side-widgets-container" class="col-span-5"></div>
      </section>
    </main>
  </div>

  <!-- Command Palette Modal (Commit 3) -->
  <div id="command-palette-modal" class="modal-overlay"></div>

  <!-- Toolbox Modal for Fullscreen Tools -->
  <div id="toolbox-modal" class="modal-overlay"></div>

  <!-- JavaScript Modules -->
  <script src="js/clock.js"></script>
  <script src="js/command-palette.js"></script>
  <script src="js/github-widget.js"></script>
  <script src="js/kanban.js"></script>
  <script src="js/pomodoro.js"></script>
  <script src="js/toolbox.js"></script>
  <script src="js/health-monitor.js"></script>
  <script src="js/tech-feed.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
